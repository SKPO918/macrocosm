- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMyriapoda
  categories: [ HideSpawnMenu ]
  name: myriapoda appearance
  components:
  - type: Inventory
    templateId: myriapoda
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: jumpsuit
      head:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: head
      neck:
        sizeMaps:
         32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: neck
      eyes:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: eyes
      mask:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: head
      back:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: ears
      shoes:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: hide
      gloves:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Myriapoda/displacement.rsi
            state: hide
# for both shoes and gloves I've elected to simply hide them. While this is justifiable as them having too many arms and legs to see them, it's
# also due to displacements not taking markings into account - there was no way to get these looking good without it being ugly, and unreadable anyway.
  - type: InitialBody
    organs:
      Torso: OrganMyriapodaTorso
      Head: OrganMyriapodaHead
      Brain: OrganMyriapodaBrain
      Eyes: OrganMyriapodaEyes
      Lungs: OrganMyriapodaLungs
      Heart: OrganMyriapodaHeart
      Stomach: OrganMyriapodaStomach
      Liver: OrganMyriapodaLiver
  - type: HumanoidProfile
    species: Myriapoda
    
- type: entity
  parent: OrganBase
  id: OrganMyriapoda
  abstract: true
  suffix: Myriapoda

- type: entity
  parent: OrganMyriapoda
  id: OrganMyriapodaInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _MACRO/Mobs/Species/Myriapoda/organs.rsi

- type: entity
  id: OrganMyriapodaVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Macro/Mobs/Species/Myriapoda/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Human #TODO: CHANGE!!

- type: entity
  parent: [ OrganMyriapoda, OrganMyriapodaVisual ]
  id: OrganMyriapodaExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Macro/Mobs/Species/Myriapoda/parts.rsi

- type: entity
  parent: [ OrganBaseTorso, OrganMyriapodaExternal ]
  id: OrganMyriapodaTorso
  # They're all body
  components:
  - type: HandOrgan
    handID: left
    data:
      location: Left
  

- type: entity
  parent: [ OrganBaseHead, OrganMyriapodaExternal ]
  id: OrganMyriapodaHead

- type: entity
  parent: [ OrganMyriapodaVisual, OrganBaseEyes, OrganMyriapodaInternal ]
  id: OrganMyriapodaEyes
  components:
  - type: VisualOrgan
    data:
      sprite: Mobs/Customization/eyes.rsi
      state: no_eyes
  name: antenna
  description: "You swear they just twitched..."
  
- type: entity
  parent: [ OrganBaseBrain, OrganMyriapodaInternal ]
  id: OrganMyriapodaBrain
  name: ventral nerve
  description: "A myriapoda's brain. Probably well adapted to long trains of thought..."

- type: entity
  parent: [ OrganBaseStomach, OrganMyriapodaInternal ]
  id: OrganMyriapodaStomach
  name: digestive tract
  description: "If you stretched this out straight, it would be roughly the same length as the myriapoda you took it from. Who probably wants it back."

- type: entity
  parent: [ OrganBaseLiver, OrganMyriapodaInternal ]
  id: OrganMyriapodaLiver
  components:
  - type: Metabolizer
    maxReagents: 6
    stages: [ Metabolites ] # If kidneys, appendixes, etc ever get any function, stick those here
  name: malpighian tubules
  description: "You struggle to see how these fleshy tubules could be anywhere near as complex as their name..."

- type: entity
  parent: [ OrganBaseHeart, OrganMyriapodaInternal, OrganArachnidMetabolizer ]
  id: OrganMyriapodaHeart
  name: tubular heart
  description: "Is it still a heartstring if it's just one long string of hearts...?"

- type: entity
  parent: [ OrganBaseLungs, OrganMyriapodaInternal, OrganArachnidMetabolizer ]
  id: OrganMyriapodaLungs
  name: trachea
  description: "A network of hollow pipes to aid with respiration."
  components:
  - type: Sprite
    layers:
    - state: lungs

- type: entity
  parent:
  - AppearanceMyriapoda
  - BaseSpeciesMobOrganic
  id: MobMyriapoda
  name: Urist McLegs
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatMeatball #meatball until someone makes ant meat
      amount: 1
